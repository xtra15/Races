      - '&2Orcs&7, a fierce and battle-hardened race'
      - '&7whose love for warfare and heavy weaponry'
      - '&7is unmatched. Their thick hides shrug off'
      - '&7blows that would fell lesser fighters, but'
      - '&7their bulky frames slow them down.'
